name: Publish release to GitHub

"on":
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirror main and release tag to GitHub
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          if [ -z "${tag}" ] || [ "${tag}" = "${GITHUB_REF}" ]; then
            echo "Unable to determine release tag from GITHUB_REF=${GITHUB_REF}" >&2
            exit 1
          fi

          git fetch origin main --tags
          git remote add github "https://x-access-token:${GH_TOKEN}@github.com/reisball/OpenHAVoice.git"
          git -c credential.helper= push github refs/remotes/origin/main:refs/heads/main
          git -c credential.helper= push github "refs/tags/${tag}:refs/tags/${tag}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          api="https://api.github.com/repos/reisball/OpenHAVoice"

          status="$(curl -sS -o /tmp/github-release.json -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${api}/releases/tags/${tag}")"

          if [ "${status}" = "200" ]; then
            echo "GitHub release ${tag} already exists; leaving it unchanged."
            exit 0
          fi

          if [ "${status}" != "404" ]; then
            cat /tmp/github-release.json >&2
            exit 1
          fi

          python3 - <<'PY' > /tmp/github-release-payload.json
          import json
          import os

          tag = os.environ["GITHUB_REF"].removeprefix("refs/tags/")
          print(json.dumps({
              "tag_name": tag,
              "target_commitish": "main",
              "name": tag,
              "draft": False,
              "prerelease": False,
              "generate_release_notes": True,
          }))
          PY

          curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${api}/releases" \
            --data @/tmp/github-release-payload.json
